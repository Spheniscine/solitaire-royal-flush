[package]
name = "solitaire-royal-flush"
version = "0.1.0"
authors = ["Spheniscine <spheniscine@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
arrayvec = "0.7.8"
dioxus = { version = "0.6.3", features = [] }
enum-map = "3.1.0"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
glam = "0.34.1"
phf = { version = "0.14.0", features = ["macros"] }
rand = "0.10.3"
serde = "1.0.229"
serde_tuple = "1.1.3"
serde_with = "3.24.0"
strum = "0.28.0"
strum_macros = "0.28.0"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
